name: Deploy

on:
  push:
    branches: [main, develop]

jobs:
  test-cd:
    name: Test (zyt) → develop
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Windows, X64, bf-test]
    timeout-minutes: 30
    steps:
      - name: Deploy develop → test machine
        shell: cmd
        run: call packaging\windows\deploy.bat develop

  prod-cd:
    name: Prod (snack / prod-jump) → main
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, bf-prod]
    timeout-minutes: 30
    steps:
      - name: Deploy main → prod machines
        shell: cmd
        env:
          https_proxy: http://127.0.0.1:7897
          http_proxy: http://127.0.0.1:7897
        run: call packaging\windows\deploy.bat main
