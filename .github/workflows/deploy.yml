name: Deploy

on:
  push:
    branches: [main, develop]

jobs:
  test-cd:
    name: Test (zyt) → develop
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Windows, X64, bf-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: brandflow
      - name: Deploy develop → test machine
        shell: cmd
        env:
          https_proxy: ""
          http_proxy: ""
        run: |
          echo === deploy inputs ===
          echo GITHUB_WORKSPACE=%GITHUB_WORKSPACE%
          call "%GITHUB_WORKSPACE%\packaging\windows\deploy.bat" develop

  prod-cd:
    name: Prod (snack / prod-jump) → main
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, bf-prod]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: brandflow
      - name: Deploy main → prod machines
        shell: cmd
        env:
          https_proxy: ""
          http_proxy: ""
        run: |
          echo === deploy inputs ===
          echo GITHUB_WORKSPACE=%GITHUB_WORKSPACE%
          call "%GITHUB_WORKSPACE%\packaging\windows\deploy.bat" main
